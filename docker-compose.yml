version: '3.8'

services:
  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nyaymadad-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=redis://redis:6379
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    depends_on:
      - redis
    networks:
      - nyaymadad-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: nyaymadad-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nyaymadad-network

  # Frontend Web Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nyaymadad-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - nyaymadad-network

networks:
  nyaymadad-network:
    driver: bridge

volumes:
  redis-data:
