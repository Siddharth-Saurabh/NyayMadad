apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyaymadad-server
  namespace: nyaymadad
  labels:
    app: nyaymadad-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nyaymadad-server
  template:
    metadata:
      labels:
        app: nyaymadad-server
    spec:
      containers:
        - name: server
          image: registry.gitlab.com/nyaymadad/server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: nyaymadad-config
            - secretRef:
                name: nyaymadad-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /live
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nyaymadad-server-service
  namespace: nyaymadad
spec:
  type: ClusterIP
  selector:
    app: nyaymadad-server
  ports:
    - port: 5000
      targetPort: 5000
