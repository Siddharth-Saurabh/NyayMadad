apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyaymadad-client
  namespace: nyaymadad
  labels:
    app: nyaymadad-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nyaymadad-client
  template:
    metadata:
      labels:
        app: nyaymadad-client
    spec:
      containers:
        - name: client
          image: registry.gitlab.com/nyaymadad/client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nyaymadad-client-service
  namespace: nyaymadad
spec:
  type: ClusterIP
  selector:
    app: nyaymadad-client
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nyaymadad-ingress
  namespace: nyaymadad
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - nyaymadad.gov.in
      secretName: nyaymadad-tls-cert
  rules:
    - host: nyaymadad.gov.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nyaymadad-server-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nyaymadad-client-service
                port:
                  number: 80
